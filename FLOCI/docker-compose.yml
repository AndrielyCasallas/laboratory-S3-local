services:
  floci:
    image: floci/floci:latest
    container_name: floci-aws
    ports:
      - "4566:4566"
    environment:
      - FLOCI_RUN_AS_ROOT=true
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci_data:/var/lib/floci
    restart: unless-stopped

  s3-ui:
    image: ghcr.io/wenisch-tech/s3webui:latest
    container_name: s3-web-ui
    ports:
      - "8080:8080"
    user: "0:0"
    environment:
      - S3_ENDPOINT_URL=http://floci:4566
      - S3_ACCESS_KEY=test
      - S3_SECRET_KEY=test
      - S3_REGION=us-east-1
    depends_on:
      - floci
    restart: unless-stopped

volumes:
  floci_data: